name: AuditService CI

on:
  push:
    paths:
      - "AuditService/**"
      - ".github/workflows/audit-service-ci.yml"
  pull_request:
    paths:
      - "AuditService/**"
      - ".github/workflows/audit-service-ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AuditService/AuditService.sln

      - name: Build
        run: dotnet build AuditService/AuditService.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test AuditService/AuditService.sln
          -c Release --no-build
          --logger "trx;LogFilePrefix=audit-test-results"
          --results-directory ./TestResults

      - name: Test report
        uses: dorny/test-reporter@v1
        if: ${{ !cancelled() }}
        with:
          name: AuditService test results
          path: TestResults/*.trx
          reporter: dotnet-trx