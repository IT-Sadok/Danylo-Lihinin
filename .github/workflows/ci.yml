name: CI

on:
  push:
  pull_request:
  workflow_dispatch:


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WebApiBooking/WebApiBooking.sln

      - name: Build
        run: dotnet build WebApiBooking/WebApiBooking.sln -c release --no-restore

      - name: Test
        run: >
          dotnet test WebApiBooking/WebApiBooking.sln
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Test report
        uses: dorny/test-reporter@v1
        if: ${{  !cancelled()  }}
        with:
          name: Test results
          path: TestResults/*.trx
          reporter: dotnet-trx