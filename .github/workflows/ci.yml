name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WebApiBooking/WebApiBooking.sln

      - name: Build
        run: dotnet build WebApiBooking/WebApiBooking.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test WebApiBooking/WebApiBooking.sln
          -c Release --no-build
          --logger "trx;LogFilePrefix=test-results"
          --results-directory ./TestResults

      - name: Test report
        uses: dorny/test-reporter@v1
        if: ${{ !cancelled() }}
        with:
          name: Test results
          path: TestResults/*.trx
          reporter: dotnet-trx

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/webapibooking
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: WebApiBooking
          file: WebApiBooking/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max